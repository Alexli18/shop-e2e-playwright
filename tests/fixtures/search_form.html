<!-- /search page body, copied from the live markup (advanced block hidden until 'Advanced search' is checked). -->
<div class="page search-page">
<div class="page-title"><h1>Search</h1></div>
<div class="page-body">
<div class="search-input">
<form action="/search" method="get" novalidate="novalidate">
  <div class="basic-search">
    <div class="inputs">
      <label for="Q">Search keyword:</label>
      <input class="search-text" id="Q" name="Q" type="text" value="{{query}}">
    </div>
    {{advanced_toggle}}
  </div>
  {{advanced_block}}
  <div class="buttons">
    <input type="submit" class="button-1 search-button" value="Search">
  </div>
</form>
</div>
{{results}}
</div>
</div>
