<div class="item-box">
<div class="product-item" data-productid="{{id}}">
<div class="picture">
<a href="{{href}}" title="Show details for {{title}}"><img alt="Picture of {{title}}" src="data:," title="Show details for {{title}}"></a>
</div>
<div class="details">
<h2 class="product-title">
<a href="{{href}}">{{title}}</a>
</h2>
<div class="product-rating-box" title="12 review(s)"><div class="rating"><div style="width: 60%"></div></div></div>
<div class="description">
{{title}} description
</div>
<div class="add-info">
<div class="prices">
{{prices}}
</div>
<div class="buttons">
<input type="button" value="Add to cart" class="button-2 product-box-add-to-cart-button">
</div>
</div>
</div>
</div>
</div>
