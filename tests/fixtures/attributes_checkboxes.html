<!-- Two required checkbox groups (nopCommerce 'Checkboxes' control): the option chooser does not tick
     checkboxes, so the shop refuses with one message per group. -->
<div class="attributes">
<dl>
<dt><label class="text-prompt">Software</label> <span class="required">*</span></dt>
<dd>
<ul class="option-list">
<li><input id="product_attribute_80_1_1_1" type="checkbox" name="product_attribute_80_1_1" value="1">
<label for="product_attribute_80_1_1_1">Office suite</label></li>
</ul>
</dd>
<dt><label class="text-prompt">Accessories</label> <span class="required">*</span></dt>
<dd>
<ul class="option-list">
<li><input id="product_attribute_80_2_2_1" type="checkbox" name="product_attribute_80_2_2" value="1">
<label for="product_attribute_80_2_2_1">Mouse</label></li>
</ul>
</dd>
</dl>
</div>
