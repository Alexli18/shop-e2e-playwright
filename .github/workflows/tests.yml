name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly live run against the public demo shop
  workflow_dispatch:
    inputs:
      browser:
        description: Browser(s) for the live e2e job
        type: choice
        options: [both, chromium, firefox]
        default: both
      env:
        description: Profile from config/environments.json
        type: choice
        options: [ci, demo-webshop, debug]
        default: ci
      cases:
        description: Optional shopping cases JSON (path in the repository); empty = data/shopping_cases.json
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (hash-locked, with dev tools)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  unit-component:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hash-locked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: playwright install --with-deps chromium
      - name: Unit and component tests (no network)
        run: pytest -m "unit or component" -n auto --browser chromium
      - name: Test summary
        if: always()
        run: python .github/scripts/junit_summary.py "Unit + component (Python ${{ matrix.python-version }})"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: unit-component-py${{ matrix.python-version }}
          path: artifacts/
          retention-days: 14

  smoke:
    needs: unit-component
    # Pull requests get the critical e2e case(s); the full e2e suite runs as `e2e`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hash-locked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: playwright install --with-deps chromium
      # A new user is registered per test; SHOP_EMAIL/SHOP_PASSWORD are deliberately not set (they share one
      # account and cart, which parallel workers cannot).
      - name: Smoke (e2e, live)
        run: pytest -m smoke --browser chromium --env ci --e2e-reruns 1 --timeout 300
      - name: Test summary
        if: always()
        run: python .github/scripts/junit_summary.py "Smoke (chromium)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: smoke-chromium
          path: artifacts/
          retention-days: 14

  e2e:
    needs: unit-component
    # The live demo shop is public and shared: nightly, on manual dispatch and on pushes to main only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.browser != 'both'
          && format('["{0}"]', inputs.browser) || '["chromium", "firefox"]') }}
    env:
      SHOP_CASES: ${{ inputs.cases }}  # empty outside workflow_dispatch: the default data file is used
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hash-locked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - run: playwright install --with-deps ${{ matrix.browser }}
      # A new user is registered per test; SHOP_EMAIL/SHOP_PASSWORD are deliberately not set (they share one
      # account and cart, which parallel workers cannot).
      - name: E2E scenario (all data cases, live)
        run: >-
          pytest -m e2e --browser ${{ matrix.browser }} --env ${{ inputs.env || 'ci' }}
          -n 3 --e2e-reruns 1 --timeout 300
      - name: Test summary
        if: always()
        run: python .github/scripts/junit_summary.py "E2E (${{ matrix.browser }})"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14

  allure-report:
    needs: e2e
    if: always() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: e2e-*
          path: downloaded
      - name: Merge the Allure results of all browsers
        run: |
          shopt -s nullglob
          mkdir -p allure-results
          browsers=()
          for leg in downloaded/e2e-*; do
            if [ ! -d "$leg/allure-results" ]; then
              echo "::warning::$leg has no allure-results (the leg failed before the tests ran); skipped"
              continue
            fi
            browsers+=("${leg#downloaded/e2e-}")
            cp -r "$leg"/allure-results/. allure-results/
          done
          # Every leg wrote its own environment.properties; describe the merged run instead.
          joined=$(IFS=,; echo "${browsers[*]}")
          if [ -f allure-results/environment.properties ]; then
            sed -i "s/^Browser=.*/Browser=${joined}/" allure-results/environment.properties
            cat allure-results/environment.properties
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Generate the Allure HTML report
        run: npx --yes allure-commandline@2.34.0 generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  deploy-pages:
    needs: allure-report
    # Needs Settings -> Pages -> Source "GitHub Actions". Only the default branch publishes the report.
    if: >-
      always() && needs.allure-report.result == 'success' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: allure-report
          path: allure-report
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
